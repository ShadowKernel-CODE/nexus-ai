{% extends "base.html" %}
{% block title %}Sign In - MemoryBot{% endblock %}
{% block body %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="text-center slide-up" style="margin-bottom:28px;">
            <div class="avatar avatar-xl" style="background:var(--gradient-primary);margin:0 auto 18px;box-shadow:0 0 40px rgba(232,39,127,0.35);overflow:hidden;">
                <img src="/static/img/logo.png" alt="MemoryBot" style="width:46px;height:46px;object-fit:contain;">
            </div>
            <h1 style="font-size:32px;font-weight:800;color:var(--cream);margin:0;letter-spacing:-0.02em;">MemoryBot</h1>
            <p class="dim" style="margin-top:8px;font-size:15px;">AI Memory Companion</p>
        </div>

        <div class="card slide-up" style="padding:32px;">
            <div class="disclaimer-note" style="margin-bottom:24px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span><strong>AI Simulation:</strong> The AI is NOT the actual person being remembered.</span>
            </div>

            {% if error %}
            <div class="alert-error" style="margin-bottom:16px;text-align:center;">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/auth/login" style="display:flex;flex-direction:column;gap:16px;">
                <div>
                    <label class="field-label" for="email">Email</label>
                    <input type="email" id="email" name="email" required class="input-field" placeholder="you@example.com">
                </div>
                <div>
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" name="password" required class="input-field" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;margin-top:8px;">
                    Sign In
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <div class="divider" style="margin:24px 0;"></div>

            <p class="text-center" style="font-size:14px;color:var(--cream-dim);margin:0;">
                Don't have an account?
                <a href="/auth/register" class="no-underline" style="color:var(--violet-soft);font-weight:600;">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
