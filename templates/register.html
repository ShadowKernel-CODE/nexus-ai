{% extends "base.html" %}
{% block title %}Create Account - MemoryBot{% endblock %}
{% block body %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="text-center slide-up" style="margin-bottom:28px;">
            <div class="avatar avatar-xl avatar-amber" style="margin:0 auto 18px;">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
            </div>
            <h1 style="font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--cream);margin:0;">Create Account</h1>
            <p class="dim" style="margin-top:8px;font-size:15px;">Join MemoryBot to preserve the memories that matter.</p>
        </div>

        <div class="card slide-up" style="padding:32px;">
            {% if error %}
            <div class="alert-error" style="margin-bottom:16px;text-align:center;">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/auth/register" style="display:flex;flex-direction:column;gap:16px;">
                <div>
                    <label class="field-label" for="name">Full Name</label>
                    <input type="text" id="name" name="name" required class="input-field" placeholder="John Smith">
                </div>
                <div>
                    <label class="field-label" for="email">Email</label>
                    <input type="email" id="email" name="email" required class="input-field" placeholder="you@example.com">
                </div>
                <div>
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8" class="input-field" placeholder="At least 8 characters">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;margin-top:8px;">
                    Create Account
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <div class="divider" style="margin:24px 0;"></div>

            <p class="text-center" style="font-size:14px;color:var(--cream-dim);margin:0;">
                Already have an account?
                <a href="/auth/login" class="no-underline" style="color:var(--violet-soft);font-weight:600;">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
